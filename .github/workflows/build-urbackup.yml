name: Build UrBackup Docker Image

on:
  schedule:
    # Vérifie toutes les 6 heures
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permet déclenchement manuel
  push:
    branches: [ main ]

permissions:
  contents: write  # ← Ajouter ceci
  # packages: write  # ← Si vous utilisez GHCR

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get latest UrBackup release
        id: urbackup
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/uroni/urbackup_backend/tags" |   jq -r '[.[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+client$")) | .name] | map(gsub("client$";"")) | sort_by(split(".") | map(tonumber)) | reverse | .[0]')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest UrBackup version: $LATEST"
      
      - name: Check if already built
        id: check
        run: |
          # Lire la version actuelle si elle existe
          if [ -f "current_version.txt" ]; then
            CURRENT=$(cat current_version.txt)
            echo "current=$CURRENT" >> $GITHUB_OUTPUT
          else
            CURRENT="none"
            echo "current=none" >> $GITHUB_OUTPUT
          fi
          
          echo "Current version: $CURRENT"
          echo "Latest version: ${{ steps.urbackup.outputs.version }}"
          
          # Comparer les versions
          if [ "${{ steps.urbackup.outputs.version }}" != "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ New version detected - will build"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No update needed"
          fi
      
      - name: Set up QEMU
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # # Optionnel: Login to GitHub Container Registry
      # - name: Login to GHCR
      #   if: steps.check.outputs.changed == 'true'
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ steps.urbackup.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/urbackup:${{ steps.urbackup.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/urbackup:latest
          #   ghcr.io/${{ github.repository }}:${{ steps.urbackup.outputs.version }}
          #   ghcr.io/${{ github.repository }}:latest
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      
      - name: Update version file
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.urbackup.outputs.version }}" > current_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_version.txt
          git commit -m "🚀 Update to UrBackup version ${{ steps.urbackup.outputs.version }}"
          git push
      
      # - name: Create GitHub Release
      #   if: steps.check.outputs.changed == 'true'
      #   uses: actions/create-release@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     tag_name: ${{ steps.urbackup.outputs.version }}
      #     release_name: UrBackup ${{ steps.urbackup.outputs.version }}
      #     body: |
      #       Docker image built for UrBackup version ${{ steps.urbackup.outputs.version }}
            
      #       Upstream release: https://github.com/uroni/urbackup_backend/releases/tag/${{ steps.urbackup.outputs.version }}
            
      #       **Docker Images:**
      #       - `${{ secrets.DOCKERHUB_USERNAME }}/urbackup:${{ steps.urbackup.outputs.version }}`
      #       - `ghcr.io/${{ github.repository }}:${{ steps.urbackup.outputs.version }}`
      #     draft: false
      #     prerelease: false

- name: Create GitHub Release
  if: steps.check.outputs.changed == 'true'
  uses: softprops/action-gh-release@v1
  with:
    tag_name: ${{ steps.urbackup.outputs.version }}
    name: UrBackup ${{ steps.urbackup.outputs.version }}
    body: |
      Docker image built for UrBackup version ${{ steps.urbackup.outputs.version }}
      
      Upstream release: https://github.com/uroni/urbackup_backend/releases/tag/${{ steps.urbackup.outputs.version }}client
      
      **Docker Images:**
      - `${{ secrets.DOCKERHUB_USERNAME }}/urbackup:${{ steps.urbackup.outputs.version }}`
      - `${{ secrets.DOCKERHUB_USERNAME }}/urbackup:latest`
    draft: false
    prerelease: false
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      